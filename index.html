<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f1e3" />
<title>成语小书</title>
<link rel="manifest" href="manifest.webmanifest" />
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script type="module">
  import * as QRCodeNS from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm';
  window.QRCode = QRCodeNS;
</script>
<style>
  :root{
    /* 新中式 · 宣纸米黄 */
    --paper:#f7f1e3;
    --paper-2:#efe6d3;
    --card:#fffdf8;
    --ink:#2b2620;
    --ink-soft:#6b6052;
    --ink-faint:#9a8f7a;
    --accent:#b5341f;      /* 朱砂 */
    --accent-soft:#c9705f;
    --jade:#5b8c6e;        /* 竹青 */
    --indigo:#3a5a78;      /* 黛蓝 */
    --line:#e3d9c4;
    --line-soft:#f0e8d8;
    --mark:#f5ecd9;
    --radius:16px;
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  [data-theme="dark"]{
    --paper:#1c1a17;
    --paper-2:#26231e;
    --card:#2a2620;
    --ink:#ece4d4;
    --ink-soft:#b3a892;
    --ink-faint:#7d745f;
    --accent:#e07a5f;
    --accent-soft:#c9705f;
    --jade:#7fb093;
    --indigo:#7fa6c4;
    --line:#3a352c;
    --line-soft:#322d25;
    --mark:#332e25;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
    transition:background .25s,color .25s;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{padding:18px 0 6px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .brandbox{display:flex;align-items:center;gap:11px;}
  .seal{
    width:40px;height:40px;flex:none;
    background:var(--accent);border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--serif);font-size:22px;font-weight:700;
    box-shadow:0 2px 6px rgba(181,52,31,.25);
  }
  .brand{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.12em;color:var(--ink);line-height:1.1;}
  .brand-mini{font-size:11.5px;letter-spacing:.08em;color:var(--ink-faint);margin-top:3px;}
  .toc-open{
    padding:7px 15px;border:1px solid var(--line);border-radius:20px;
    background:var(--card);color:var(--ink-soft);
    font-family:var(--sans);font-size:13px;letter-spacing:.05em;cursor:pointer;
  }
  .toc-open:active{background:var(--mark);}

  .search{position:relative;margin:10px 0 4px;}
  .search input{
    width:100%;padding:12px 14px 12px 38px;
    border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--ink);
    font-family:var(--sans);font-size:15px;outline:none;transition:border-color .15s;
  }
  .search input:focus{border-color:var(--accent-soft);}
  .search input::placeholder{color:var(--ink-faint);}
  .search .ico{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border:1.7px solid var(--ink-faint);border-radius:50%;
  }
  .search .ico::after{
    content:'';position:absolute;right:-5px;bottom:-3px;
    width:6px;height:1.7px;background:var(--ink-faint);transform:rotate(45deg);
  }

  .themes{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .themes::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:6px 13px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--ink-soft);
    font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;
    transition:all .15s;
  }
  .chip:active{background:var(--mark);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 22px 22px;margin-top:12px;
    box-shadow:0 1px 2px rgba(60,50,30,.04);
    animation:fade .26s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .head{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line-soft);}
  .word{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:.1em;margin:0;color:var(--ink);line-height:1.35;}
  .pinyin{font-size:13px;color:var(--accent);letter-spacing:.09em;margin-top:7px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
  .tag{font-size:11px;color:var(--jade);background:var(--mark);border-radius:10px;padding:2px 9px;letter-spacing:.05em;}

  .quote{
    margin:18px 0 4px;padding:14px 16px;
    background:var(--mark);border-radius:11px;border-left:3px solid var(--accent-soft);
  }
  .quote .q{display:block;font-family:var(--serif);font-size:15px;line-height:1.95;color:var(--ink);letter-spacing:.03em;}
  .quote .src{display:block;margin-top:8px;font-size:12px;color:var(--ink-soft);font-style:normal;}

  .story{margin:18px 0 6px;}
  .story p{margin:0 0 16px;font-size:16.5px;line-height:1.95;color:var(--ink);text-align:justify;text-justify:inter-ideograph;word-break:break-word;letter-spacing:.02em;text-indent:2em;}
  .story p:last-child{margin-bottom:0;}
  .fs-s .story p{font-size:15px;line-height:1.9;text-indent:2em;}
  .fs-l .story p{font-size:18.5px;line-height:2.05;text-indent:2em;}

  .gloss{margin:18px 0 2px;padding:15px 18px;background:var(--mark);border-radius:12px;border-left:3px solid var(--accent);}
  .gloss-word{font-family:var(--serif);font-size:15px;color:var(--accent);letter-spacing:.04em;margin-bottom:7px;line-height:1.5;}
  .gloss-word .gw{font-weight:700;}
  .gloss-text{font-size:15.5px;line-height:1.9;color:var(--ink);letter-spacing:.02em;text-align:justify;text-justify:inter-ideograph;}

  .moral{margin-top:16px;padding:14px 16px;background:var(--paper-2);border-radius:11px;border:1px solid var(--line);}
  .moral .lab{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--accent);margin-bottom:6px;}
  .moral .txt{font-size:15px;line-height:1.85;color:var(--ink);}

  .controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px;}
  .controls button{
    padding:8px 13px;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--ink-soft);
    font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;cursor:pointer;transition:all .15s;
  }
  .controls button:active{background:var(--mark);}
  .controls button.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  .nav{display:flex;gap:9px;margin-top:12px;}
  .nav button{
    flex:1;padding:12px 0;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--ink);
    font-family:var(--sans);font-size:14px;letter-spacing:.05em;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .nav button:active{background:var(--mark);}
  .nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .nav button.primary:active{background:var(--accent-soft);}

  .meta{text-align:center;margin-top:14px;font-size:12px;color:var(--ink-faint);letter-spacing:.05em;}
  .empty{text-align:center;padding:48px 20px;color:var(--ink-faint);font-size:14px;}
  .loading{text-align:center;padding:56px 20px;color:var(--ink-faint);font-size:14px;}
  footer{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-faint);line-height:1.9;}

  /* 目录抽屉 */
  .overlay{position:fixed;inset:0;background:rgba(40,34,26,.42);z-index:40;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:86vh;display:flex;flex-direction:column;background:var(--paper);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -6px 24px rgba(40,34,26,.18);transform:translateY(100%);transition:transform .26s ease;}
  .sheet.open{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;}
  .sheet-head span{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--ink);}
  .sheet-close{border:none;background:none;color:var(--accent-soft);font-family:var(--sans);font-size:13.5px;cursor:pointer;padding:4px 6px;}
  .seg{display:flex;gap:8px;padding:0 18px 10px;}
  .seg button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink-soft);font-family:var(--sans);font-size:13px;letter-spacing:.05em;cursor:pointer;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .toc-search{position:relative;padding:0 18px 12px;}
  .toc-search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--sans);font-size:14px;outline:none;}
  .toc-search .ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:12px;height:12px;border:1.7px solid var(--ink-faint);border-radius:50%;}
  .toc-search .ico::after{content:'';position:absolute;right:-4px;bottom:-3px;width:5px;height:1.7px;background:var(--ink-faint);transform:rotate(45deg);}
  .toc-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(20px + env(safe-area-inset-bottom));}
  .toc-group-h{position:sticky;top:0;background:var(--paper);padding:12px 8px 6px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--accent);}
  .toc-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;font-family:var(--sans);}
  .toc-item:active{background:var(--mark);}
  .toc-item.cur{background:var(--mark);}
  .toc-item.cur .toc-word{color:var(--accent);}
  .toc-word{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.06em;min-width:64px;}
  .toc-pinyin{font-size:12px;color:var(--ink-faint);flex:1;}
  .toc-cat{font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:10px;white-space:nowrap;}

  /* 分享卡 */
  .share-sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:90vh;display:flex;flex-direction:column;align-items:center;background:var(--paper);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -6px 24px rgba(40,34,26,.18);padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s ease;}
  .share-sheet.open{transform:translateY(0);}
  .share-img{width:100%;max-width:300px;border-radius:12px;box-shadow:0 4px 16px rgba(40,34,26,.2);}
  .share-actions{display:flex;gap:10px;margin-top:14px;width:100%;max-width:300px;}
  .share-actions .btn{flex:1;text-align:center;padding:11px 0;border-radius:11px;font-size:14px;letter-spacing:.05em;text-decoration:none;cursor:pointer;}
  .share-actions .btn.solid{background:var(--accent);color:#fff;border:1px solid var(--accent);}
  .share-actions .btn.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);}
  .share-hint{margin-top:10px;font-size:11.5px;color:var(--ink-faint);line-height:1.5;}
  .toast{position:fixed;left:50%;top:auto;bottom:88px;transform:translateX(-50%);z-index:90;background:rgba(43,38,32,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;letter-spacing:.03em;pointer-events:none;}

  @media (max-width:400px){
    .word{font-size:27px;}
    .card{padding:22px 17px 18px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header>
      <div class="topbar">
        <div class="brandbox">
          <span class="seal">書</span>
          <div>
            <div class="brand">成语小书</div>
            <div class="brand-mini">随手翻读 · 共 {{ all.length }} 则</div>
          </div>
        </div>
        <button class="toc-open" @click="openToc">目录 {{ all.length }} 则</button>
      </div>

      <div class="search">
        <span class="ico"></span>
        <input v-model="query" type="search" placeholder="搜成语 / 拼音 / 首字母（如 hldj）" />
      </div>

      <div class="themes">
        <button v-for="t in themes" :key="t" :class="['chip',{on: theme===t}]" @click="theme=t">{{ t }}</button>
      </div>
    </header>

    <div v-if="!loaded" class="loading">正在加载故事…</div>
    <div v-else-if="!view.length" class="empty">没有找到相关的成语</div>

    <template v-else>
      <article class="card" :class="'fs-'+fontSize" :key="current.word"
               @touchstart="onTs" @touchend="onTe">
        <div class="head">
          <h2 class="word">{{ current.word }}</h2>
          <div class="pinyin" v-show="showPinyin">{{ current.pinyin }}</div>
          <div class="tags">
            <span class="tag" v-for="t in current.tags" :key="t">{{ t }}</span>
          </div>
        </div>

        <blockquote class="quote" v-if="showQuote && current.quote">
          <span class="q">{{ current.quote }}</span>
          <cite class="src">—— {{ current.source }}</cite>
        </blockquote>

        <div class="story">
          <p v-for="(p,i) in narration" :key="'n'+i">{{ p }}</p>
        </div>

        <div class="gloss" v-if="gloss">
          <div class="gloss-word">这就是<span class="gw">「{{ gloss.word }}」</span></div>
          <div class="gloss-text">{{ gloss.text }}</div>
        </div>

        <div class="moral" v-show="showMoral">
          <span class="lab">讲个道理</span>
          <span class="txt">{{ current.moral }}</span>
        </div>
      </article>

      <div class="controls">
        <button :class="{on: fontSize==='s'}" @click="fontSize='s'">小</button>
        <button :class="{on: fontSize==='m'}" @click="fontSize='m'">中</button>
        <button :class="{on: fontSize==='l'}" @click="fontSize='l'">大</button>
        <button :class="{on: showPinyin}" @click="showPinyin=!showPinyin">{{ showPinyin ? '隐拼音' : '显拼音' }}</button>
        <button :class="{on: showQuote}" @click="showQuote=!showQuote">{{ showQuote ? '隐原文' : '显原文' }}</button>
        <button :class="{on: dark}" @click="toggleDark">{{ dark ? '日间' : '夜读' }}</button>
        <button :class="{on: isFav}" @click="toggleFav">{{ isFav ? '已藏' : '收藏' }}</button>
        <button @click="shareCard">分享卡</button>
      </div>

      <nav class="nav">
        <button @click="prev">上一则</button>
        <button class="primary" @click="shuffle">换一则</button>
        <button @click="next">下一则</button>
      </nav>

      <div class="meta">第 {{ idx + 1 }} 则 / 共 {{ view.length }} 则</div>
    </template>

    <footer>
      故事依据公版古籍原文与台湾教育部《成语典》白话典故改写<br />
      共 {{ all.length }} 则 · 仅供阅读参考
    </footer>
  </div>

  <!-- 目录抽屉 -->
  <div class="overlay" v-if="showToc" @click="closeToc"></div>
  <div class="sheet" :class="{open: showToc}">
    <div class="sheet-head">
      <span>目录</span>
      <button class="sheet-close" @click="closeToc">收起</button>
    </div>
    <div class="seg">
      <button :class="{on: tocMode==='pinyin'}" @click="tocMode='pinyin'">按拼音</button>
      <button :class="{on: tocMode==='cat'}" @click="tocMode='cat'">按出处</button>
      <button :class="{on: tocMode==='theme'}" @click="tocMode='theme'">按主题</button>
    </div>
    <div class="toc-search">
      <span class="ico"></span>
      <input v-model="tocQuery" type="search" placeholder="在目录里找" />
    </div>
    <div class="toc-list">
      <template v-for="g in tocGroups" :key="g.key">
        <div class="toc-group-h">{{ g.key }}</div>
        <button v-for="it in g.items" :key="it.word"
                class="toc-item" :class="{cur: it.word===current.word}"
                @click="jumpTo(it.word)">
          <span class="toc-word">{{ it.word }}</span>
          <span class="toc-pinyin">{{ it.pinyin }}</span>
          <span class="toc-cat">{{ it.cat }}</span>
        </button>
      </template>
      <div v-if="!tocGroups.length" class="empty">目录里没有匹配的</div>
    </div>
  </div>

  <!-- 分享卡 -->
  <div class="overlay" v-if="showShare" @click="showShare=false"></div>
  <div class="share-sheet" :class="{open: showShare}">
    <img v-if="shareImg" :src="shareImg" class="share-img" alt="成语分享卡" />
    <div class="share-actions" v-if="shareImg">
      <button class="btn solid" @click="copyLink">复制链接</button>
      <button class="btn ghost" @click="showShare=false">关闭</button>
    </div>
    <div class="share-hint">手机可长按图片：保存相册 / 发送给朋友；或直接复制链接，去微信粘贴给好友</div>
  </div>
  <div class="toast" v-if="toast">{{ toast }}</div>
</div>

<script>
  const { createApp } = Vue;
  const APP_VERSION = '18';

  function randInt(n){
    if(n <= 0) return 0;
    const arr = new Uint32Array(1);
    if(window.crypto && window.crypto.getRandomValues){
      window.crypto.getRandomValues(arr);
      return arr[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  // 出处五大类（数据可推导，不改故事文本）
  function catOf(src){
    const s = src || '';
    if(/诗经|书经|礼记|论语|孟子|左传|易|中庸|大学|孝经|公羊|穀梁|仪礼/.test(s)) return '经部';
    if(/史记|汉书|后汉书|晋书|三国志|东观汉记|战国策|资治通鉴|汉纪|国语|竹书/.test(s)) return '史部';
    if(/庄子|韩非子|列子|吕氏春秋|淮南子|管子|尹文子|荀子|老子|墨子|晏子|文子|慎子|商君|孙子|尉缭子|鬼谷子/.test(s)) return '子部';
    if(/唐诗|宋词|柳宗元|陶潜|苏轼|欧阳修|沈既济|王嘉|世说新语|刘义庆|习凿齿|羊欣|诸葛亮|左思|三戒|桃花源|枕中记|王氏伯仲|文与可|方舆胜览|过庭录|归田录|笔阵图/.test(s)) return '集部';
    if(/山海经|风俗通义|说苑|新语|拾遗记|弘明集|碧岩录|法苑|高僧传|神仙传/.test(s)) return '笔记佛典';
    return '其他';
  }

  function initialsOf(pinyin){
    return (pinyin||'').toLowerCase().split(/\s+/).map(w => w[0] || '').join('');
  }

  const THEMES = ['全部','动物','人物','战争','自然','学习','品德','友谊','励志','智慧','历史','数字','颜色','身体','言语','收藏'];

  createApp({
    data(){
      let favs = [];
      try { favs = JSON.parse(localStorage.getItem('idiom_favs') || '[]'); } catch(e){}
      return {
        loaded:false,
        all:[],
        query:'',
        theme:'全部',
        themes:THEMES,
        idx:0,
        showQuote:false,
        showMoral:false,
        showToc:false,
        tocMode:'pinyin',
        tocQuery:'',
        fontSize:'m',
        showPinyin:true,
        dark:false,
        favs,
        showShare:false,
        shareImg:'',
        shareUrl:'',
        toast:'',
        tx:0,
      };
    },
    computed:{
      view(){
        const q = this.query.trim().toLowerCase().replace(/\s/g,'');
        let base = this.all;
        if(this.theme === '收藏'){
          base = base.filter(s => this.favs.includes(s.word));
        } else if(this.theme && this.theme !== '全部'){
          base = base.filter(s => (s.tags || []).includes(this.theme));
        }
        if(q){
          base = base.filter(s =>
            s.word.includes(q) ||
            s.py.includes(q) ||
            s.initials.includes(q)
          );
        }
        return base;
      },
      current(){
        return this.view[this.idx] || null;
      },
      isFav(){
        return this.current ? this.favs.includes(this.current.word) : false;
      },
      narration(){
        if(!this.current) return [];
        const raw = this.current.story.split(/\n+/).map(s => s.trim()).filter(Boolean);
        const pat = /^这就是「(.+?)」——(.+)$/;
        if(raw.length && pat.test(raw[raw.length-1])) raw.pop();
        return raw;
      },
      gloss(){
        if(!this.current) return null;
        const raw = this.current.story.split(/\n+/).map(s => s.trim()).filter(Boolean);
        const pat = /^这就是「(.+?)」——(.+)$/;
        const last = raw[raw.length-1] || '';
        const m = pat.exec(last);
        if(!m) return null;
        return { word:m[1], text:m[2] };
      },
      tocGroups(){
        const q = this.tocQuery.trim().toLowerCase().replace(/\s/g,'');
        let list = this.all;
        if(q){
          list = list.filter(s =>
            s.word.includes(q) ||
            s.py.includes(q) ||
            s.initials.includes(q)
          );
        }
        const map = {};
        for(const s of list){
          let key;
          if(this.tocMode === 'pinyin'){
            const f = (s.pinyin.trim()[0] || '?').normalize('NFD');
            let k = '';
            for (const ch of f){ const cp = ch.codePointAt(0); if(cp < 0x0300 || cp > 0x036F) k += ch; }
            key = k.toUpperCase();
          } else if(this.tocMode === 'cat'){
            key = catOf(s.source);
          } else {
            key = (s.tags && s.tags[0]) || '其他';
          }
          const cat = catOf(s.source);
          (map[key] = map[key] || []).push({ word:s.word, pinyin:s.pinyin, cat });
        }
        let keys = Object.keys(map);
        if(this.tocMode === 'pinyin'){ keys.sort(); }
        else if(this.tocMode === 'cat'){
          const order = {'经部':0,'史部':1,'子部':2,'集部':3,'笔记佛典':4,'其他':5};
          keys.sort((a,b) => (order[a] ?? 9) - (order[b] ?? 9));
        } else { keys.sort(); }
        return keys.map(k => ({ key:k, items:map[k] }));
      },
    },
    watch:{
      query(){ this.idx = 0; },
      theme(){ this.idx = 0; },
      favs(){
        try { localStorage.setItem('idiom_favs', JSON.stringify(this.favs)); } catch(e){}
      },
      current(){ this.showQuote = false; },
      dark(v){ document.documentElement.setAttribute('data-theme', v ? 'dark' : 'light'); },
    },
    methods:{
      catOf,
      shuffle(){ if(this.view.length) this.idx = randInt(this.view.length); },
      prev(){ const n = this.view.length; if(n) this.idx = (this.idx - 1 + n) % n; },
      next(){ const n = this.view.length; if(n) this.idx = (this.idx + 1) % n; },
      openToc(){ this.tocQuery = ''; this.showToc = true; },
      closeToc(){ this.showToc = false; },
      jumpTo(word){
        this.tocQuery = ''; this.query = ''; this.theme = '全部';
        const i = this.all.findIndex(s => s.word === word);
        if(i >= 0) this.idx = i;
        this.showToc = false;
      },
      toggleDark(){ this.dark = !this.dark; },
      toggleFav(){
        if(!this.current) return;
        const w = this.current.word;
        const i = this.favs.indexOf(w);
        if(i >= 0) this.favs.splice(i,1); else this.favs.push(w);
      },
      onTs(e){ if(e.changedTouches && e.changedTouches[0]) this.tx = e.changedTouches[0].clientX; },
      onTe(e){
        if(!e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - this.tx;
        if(dx < -40) this.next(); else if(dx > 40) this.prev();
      },
      async shareCard(){
        if(!this.current) return;
        const s = this.current;
        const shareUrl = 'https://hengjie1993-lang.github.io/idiom-stories/?q=' + encodeURIComponent(s.word);
        this.shareUrl = shareUrl;
        const c = document.createElement('canvas');
        c.width = 1080; c.height = 1440;
        const x = c.getContext('2d');
        x.fillStyle = '#f7f1e3'; x.fillRect(0,0,1080,1440);
        x.strokeStyle = '#b5341f'; x.lineWidth = 6;
        x.strokeRect(48,48,1080-96,1440-96);
        x.strokeStyle = '#e3d9c4'; x.lineWidth = 1.5;
        x.strokeRect(64,64,1080-128,1440-128);

        x.textAlign = 'center';
        x.fillStyle = '#b5341f';
        x.font = '600 38px "Songti SC","SimSun",serif';
        x.fillText('成 语 小 书', 540, 150);
        x.fillStyle = '#9a8f7a';
        x.font = '400 24px sans-serif';
        x.fillText('随手翻读 · 共 ' + this.all.length + ' 则', 540, 196);

        x.fillStyle = '#2b2620';
        x.font = '700 120px "Songti SC","SimSun",serif';
        x.fillText(s.word, 540, 360);
        x.fillStyle = '#b5341f';
        x.font = '400 38px sans-serif';
        x.fillText(s.pinyin, 540, 430);
        const tags = (s.tags||[]).join(' · ');
        x.fillStyle = '#5b8c6e';
        x.font = '400 30px sans-serif';
        x.fillText(tags, 540, 488);

        x.strokeStyle = '#e3d9c4'; x.lineWidth = 2;
        x.beginPath(); x.moveTo(140, 540); x.lineTo(940, 540); x.stroke();

        let y = 600;
        x.textAlign = 'left';
        x.fillStyle = '#b5341f';
        x.font = '600 32px sans-serif';
        x.fillText('小故事', 140, y);
        y += 56;
        x.fillStyle = '#2b2620';
        x.font = '400 40px "Songti SC","SimSun",serif';
        let body = (s.story || '').replace(/\n+/g, '');
        if(body.length > 100) body = body.slice(0, 100) + '……';
        y = this._wrap(x, body, 140, 940, y, 64, 8);

        const qrSize = 220, qrX = 1080 - 64 - qrSize - 24, qrY = 1120;
        x.textAlign = 'left';
        x.fillStyle = '#6b6052';
        x.font = '400 30px "Songti SC","SimSun",serif';
        x.fillText('微信 / 浏览器扫一扫', 140, 1180);
        x.fillText('直达这则成语', 140, 1230);
        x.fillStyle = '#9a8f7a';
        x.font = '400 22px sans-serif';
        x.fillText('hengjie1993-lang.github.io', 140, 1285);
        x.fillText('/idiom-stories', 140, 1318);

        try {
          if(window.QRCode && QRCode.toCanvas){
            const url = shareUrl;
            const qr = document.createElement('canvas');
            await QRCode.toCanvas(qr, url, { width:qrSize, margin:1, color:{ dark:'#2b2620', light:'#f7f1e3' } });
            x.drawImage(qr, qrX, qrY, qrSize, qrSize);
          } else { throw new Error('no qrcode'); }
        } catch(e){
          x.strokeStyle = '#b5341f'; x.lineWidth = 2;
          x.strokeRect(qrX, qrY, qrSize, qrSize);
          x.fillStyle = '#b5341f'; x.textAlign = 'center';
          x.font = '400 24px sans-serif';
          x.fillText('扫码访问', qrX + qrSize/2, qrY + qrSize/2);
          x.textAlign = 'left';
        }

        this.shareImg = c.toDataURL('image/png');
        this.showShare = true;
      },
      copyLink(){
        const url = this.shareUrl || ('https://hengjie1993-lang.github.io/idiom-stories/?q=' + encodeURIComponent(this.current ? this.current.word : ''));
        this._copy(url);
        this.showToast('链接已复制，去微信粘贴给好友');
      },
      _copy(text){
        try {
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).catch(()=>{});
            return;
          }
        } catch(e){ /* 降级到 execCommand */ }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try { document.execCommand('copy'); } catch(e){}
        document.body.removeChild(ta);
      },
      showToast(msg){
        this.toast = msg;
        clearTimeout(this._t);
        this._t = setTimeout(() => { this.toast = ''; }, 1800);
      },
      _wrap(ctx, text, x, x2, y, lh, maxLines = 999){
        const max = x2 - x;
        const lines = [];
        let line = '';
        for(const ch of (text || '')){
          if(ctx.measureText(line + ch).width > max && line){
            lines.push(line); line = ch;
            if(lines.length >= maxLines) break;
          } else { line += ch; }
        }
        if(line && lines.length < maxLines) lines.push(line);
        if(lines.length >= maxLines && line){
          let last = lines[lines.length-1];
          while(last.length && ctx.measureText(last + '……').width > max) last = last.slice(0,-1);
          lines[lines.length-1] = last + '……';
        }
        for(const ln of lines){ ctx.fillText(ln, x, y); y += lh; }
        return y;
      },
      async load(){
        try{
          const res = await fetch('stories.json?v=' + APP_VERSION);
          const raw = await res.json();
          this.all = raw.map(s => ({
            ...s,
            py: (s.pinyin||'').toLowerCase().replace(/\s+/g,''),
            initials: initialsOf(s.pinyin),
          }));
        }catch(e){ this.all = []; }
        this.loaded = true;
        const q = (new URLSearchParams(location.search).get('q') || '').trim();
        const di = q ? this.all.findIndex(s => s.word === q) : -1;
        this.idx = di >= 0 ? di : randInt(this.all.length);
      },
      onKey(e){
        if(this.showToc || this.showShare) return;
        if(e.key === 'ArrowLeft') this.prev();
        else if(e.key === 'ArrowRight') this.next();
      },
    },
    mounted(){
      if(this.dark) document.documentElement.setAttribute('data-theme','dark');
      this.load();
      window.addEventListener('keydown', this.onKey);
    },
  }).mount('#app');
</script>

  <script>
    // ===== Service Worker 注册（微信内禁用，避免缓存陷阱）=====
    if('serviceWorker' in navigator && !/MicroMessenger/i.test(navigator.userAgent)){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
